# Daily data refresh: re-fetches every job board and redeploys the site.
# "strict" means a total fetch failure aborts the run, so the last good deployment stays online.
name: Refresh data

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    uses: ./.github/workflows/deploy.yml
    with:
      strict: true
